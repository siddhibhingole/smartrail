services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartrail
      POSTGRES_PASSWORD: smartrail
      POSTGRES_DB: smartrail
    ports:
      - "5432:5432"
    volumes:
      - smartrail-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrail -d smartrail"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smartrail-postgres:
